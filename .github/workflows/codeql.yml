# CodeQL Advanced — analyzer of record for the 8.1.x release line.
#
# Scope: Java and JavaScript/TypeScript only (no Actions, C#, Python, etc.).
#
# IMPORTANT — only one CodeQL orchestrator may own code-scanning uploads:
#   - This workflow (.github/workflows/codeql.yml) is the analyzer of record.
#   - Code scanning *default setup* must stay state=not-configured.
#   - GitHub *Code Quality* (dynamic workflow "Code Quality: CodeQL Setup" at
#     dynamic/github-code-scanning/codeql) must be DISABLED for this repo.
#     Settings → Code quality → Disable. That dynamic runner ignores this
#     config file, scans extra languages, and empty/stub analyses on the
#     default branch close open alerts as "fixed".
#
# Verify default setup:
#   gh api repos/intersoftdatalabs-in/percussioncms-java8/code-scanning/default-setup --jq .state
#   # expected: not-configured
#
# Config applied only by this workflow:
#   - .github/codeql/codeql-config.yml (paths-ignore, query-filters)
#   - .github/codeql/models (sanitizer barrier documentation; GHA rejects
#     local pack paths in `packs:` so the runtime + sink-line // codeql
#     comments are the enforcement layer; the model packs are the audit
#     trail of declared barriers)
#
# See docs/ai-generated/tasks/8.1.x-codeql-baseline/codeql-pr-playbook.md
#
name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "44 2 * * 4"
  # Manual re-scan after config changes or after disabling Code Quality / default setup
  workflow_dispatch:

# Least privilege at workflow level; jobs elevate only what CodeQL needs.
# Repo may have default_workflow_permissions=read — security-events must be
# requested explicitly or SARIF upload silently fails to open alerts.
permissions:
  contents: read

jobs:
  # On pull_request events, detect which CodeQL languages have relevant file
  # changes so unchanged languages skip full CodeQL extraction/analysis.
  # push to main, schedule, and workflow_dispatch always run both languages.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      java-kotlin: ${{ github.event_name != 'pull_request' || steps.filter.outputs['java-kotlin'] == 'true' }}
      javascript-typescript: ${{ github.event_name != 'pull_request' || steps.filter.outputs['javascript-typescript'] == 'true' }}
    steps:
      - name: Check changed files for pull request
        if: github.event_name == 'pull_request'
        id: filter
        # Pinned to v4.0.3 (uses GitHub REST API on pull_request; no checkout needed)
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            java-kotlin:
              - '**/*.java'
              - '**/*.kt'
              - '**/*.jsp'
              - '**/*.jspf'
              - '**/*.xml'
              - '**/pom.xml'
              - '**/*.properties'
              - '**/*.gradle'
              - '**/*.gradle.kts'
              - '.mvn/**'
              - 'mvn-env.sh'
              - 'mvn-env.bat'
              - '.github/codeql/**'
              - '.github/workflows/codeql.yml'
            javascript-typescript:
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.vue'
              - '**/*.html'
              - '**/*.htm'
              - '**/package.json'
              - '**/package-lock.json'
              - '**/tsconfig*.json'
              - '.github/codeql/**'
              - '.github/workflows/codeql.yml'

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      # required to upload SARIF / open code-scanning alerts
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

      # required so PR checks / annotations can be written for the head SHA
      pull-requests: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Java only (build-mode none does not analyze Kotlin). Prefer none for
          # this monorepo size; switch to autobuild/manual if coverage is thin.
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
        # Intentionally NOT scanning: actions, c-cpp, csharp, go, python, ruby, rust, swift

    steps:
      - name: Checkout repository
        if: github.event_name != 'pull_request' || needs.changes.outputs[matrix.language] == 'true'
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        if: github.event_name != 'pull_request' || needs.changes.outputs[matrix.language] == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
          # Do not pass local pack paths via packs: — GHA fails with "not a valid pack".
          # Models remain in-repo for docs; use sink-line // codeql + query-filters.

      - name: Perform CodeQL Analysis
        if: github.event_name != 'pull_request' || needs.changes.outputs[matrix.language] == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      # PR-only fast no-op for unchanged languages: GitHub's code_scanning
      # ruleset expects every CodeQL category present on refs/heads/main to
      # report on the PR, otherwise merges block indefinitely (github/codeql-action#4330).
      # Guarded strictly by github.event_name == 'pull_request' so default-branch
      # pushes/schedules always run full analysis and never close open alerts.
      - name: Generate no-op SARIF for unchanged PR language
        if: github.event_name == 'pull_request' && needs.changes.outputs[matrix.language] != 'true'
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          cat <<'EOF' > "${RUNNER_TEMP}/noop-${LANGUAGE}.sarif"
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "CodeQL",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }
          EOF
          echo "Skipped full ${LANGUAGE} CodeQL analysis (no matching files changed in PR); uploading PR-only no-op SARIF to satisfy CodeQL merge protection."

      - name: Upload no-op SARIF for unchanged PR language
        if: github.event_name == 'pull_request' && needs.changes.outputs[matrix.language] != 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/noop-${{ matrix.language }}.sarif
          category: "/language:${{ matrix.language }}"
