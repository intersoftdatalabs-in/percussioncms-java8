name: Legacy MySQL Connector Check

on:
  pull_request:
    paths:
      - "**/*.jar"
      - "**/mysql-connector*"
      - "**/mm.mysql*"
      - "**/rxconfig/Installer/**"
      - "**/install*.xml"
      - "**/Install*.xml"
      - "**/build.xml"
      - "modules/perc-ant/**"
      - "scripts/check-legacy-mysql-connector.py"
      - "scripts/test-mysql-connector-upgrade.py"
      - ".github/workflows/legacy-mysql-connector-check.yml"
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test checker
        run: python3 -I scripts/check-legacy-mysql-connector.py --self-test
      - name: Fail if a legacy MySQL Connector/J is tracked (issue #5)
        run: python3 -I scripts/check-legacy-mysql-connector.py
      - name: Install Ant and ant-contrib for the upgrade simulation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ant ant-contrib
      - name: Upgrade simulation - installers must leave no legacy connector (issue #5)
        run: python3 -I scripts/test-mysql-connector-upgrade.py
