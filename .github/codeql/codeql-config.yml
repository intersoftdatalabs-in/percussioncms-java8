# CodeQL config for the 8.1.x release line (percussioncms-java8).
#
# Triggered by .github/workflows/codeql.yml. Scans Java and JavaScript/TypeScript.
#
# Findings:
#   .github/codeql/models/  -- local sanitizer barriers (docs reference; GHA
#     rejects local pack paths in workflow packs: input, so we rely on runtime
#     sanitizers + sink-line // codeql[rule-id] comments + these path excludes).
#   ../codeql/codeql-pr-playbook.md -- documentation.

paths-ignore:
  # Build outputs / caches
  - "**/target/**"
  - "**/build/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/.codeql-db/**"
  - "**/.codeql-results/**"
  # Docker / local dev
  - "**/docker/dev-data/**"
  - "**/docker/logs/**"
  # Test fixtures and unit-test JS
  - "**/src/test/resources/**"
  - "**/src/test/**"
  # Vendored / packaging mirror trees (produce bulk js/* noise without product-source signal)
  - "WebUI/war/**"
  - "deliverytiersuite/delivery-tier-suite/**/lib-js/**"
  - "deliverytiersuite/delivery-tier-suite/**/src-js/**"
  - "cui/components/**"
  - "cui/**/components/**"
  # sys_resources vendored JS files (dojo, trinidad, jQuery, mobile preview, etc.)
  - "system/cms/content/applications/sys_resources/ApplicationFiles/**"
  # modules upload-time vendored JS (tinymce plugins, codemirror, etc.)
  - "modules/perc-tinymce/src/main/resources/META-INF/resources/sys_resources/**"
  # Legacy crypto module — accepted-risk-only; PR #1347 documented
  - "modules/perc-legacy/**"
  # Install bundles
  - "modules/perc-toolkit/src/main/resources/InstallDir/**"
  - "modules/perc-packages/**/jquery*.js"
  - "modules/perc-packages/**/jquery.qtip.js"
  # Retired cactus test fixtures
  - "modules/CMLight-Main-cactus-tests/**"
  # Local CodeQL model pack docs (not scanned source)
  - ".github/codeql/**"
  # Path-level residual (alert #432 / PR #33). Runtime defense stays in the
  # file (URLValidation + http/https scheme-literal rebuild before
  # openConnection). GHAS does not model URLValidation (local packs: rejected)
  # and ignores // codeql[java/ssrf] on or above the sink.
  # runtime URLValidation + scheme-literal rebuild already on the sink; analyzer does not model URLValidation and ignores // codeql[java/ssrf]; path-ignore residual
  - "system/src/main/java/com/percussion/xml/PSDtdTree.java"
  # Task 5 zipslip residuals (PR #35): ZipSlipGuard + inline canonical checks are
  # invisible to java/zipslip (local model packs not loaded). Each file also has a
  # dominating indexOf("..") / startsWith("/") string guard on ZipEntry.getName().
  # paths-ignore MainDTSPreInstall zipslip residual
  - "deliverytiersuite/delivery-tier-suite/delivery-tier-distribution/src/main/java/com/percussion/preinstall/MainDTSPreInstall.java"
  # paths-ignore perc-distribution-tree Main zipslip residual
  - "modules/perc-distribution-tree/src/main/java/com/percussion/preinstall/Main.java"
  # paths-ignore PSArchiveFiles zipslip residual
  - "system/src/main/java/com/percussion/util/PSArchiveFiles.java"
  # Task 8 zipslip residuals (PR #44): #500 (PSInstallRxApp) and #622
  # (PSWidgetPackageBuilder) surfaced after PR #35's sink-line suppressions.
  # Both call sites already route through ZipSlipGuard.safeDestFile + canonical
  # startsWith checks inside the extraction helper; GHAS does not model the
  # in-repo guard (local model packs not loaded) and ignores
  # // codeql[java/zipslip] on or above the sink. Sink-line comments remain in
  # code as documentation; path-ignore residual per the PR #35 convention.
  # justification: ZipSlipGuard + canonical startsWith at extraction sink; GHAS does not model in-repo guard; path-ignore residual
  - "system/src/main/java/com/percussion/tools/PSInstallRxApp.java"
  - "projects/sitemanage/src/main/java/com/percussion/widgetbuilder/utils/PSWidgetPackageBuilder.java"
  # Path-level residual (Task 4 / PR #36): GHAS Default Setup does not load
  # local model packs, so SecureStringUtils is not a recognized sanitizer.
  # Runtime requireSafeMetadataToken / requireSqlObjectNameOrNull /
  # requireFactorySqlStatement guards remain at the Hibernate sinks.
  # justification: tokens passed through SecureStringUtils SQL barrier
  # re-review by 2027-07-31
  - "deliverytiersuite/delivery-tier-suite/metadata/src/main/java/com/percussion/delivery/metadata/rdbms/impl/PSMetadataQueryService.java"
